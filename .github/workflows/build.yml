name: Build BONELAB Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download BONELAB & MelonLoader References
      run: |
        curl -L -o refs.zip "https://github.com"
        powershell Expand-Archive refs.zip -DestinationPath Refs

    - name: Compile Mod DLL
      run: |
        mkdir build
        csc.exe /target:library /out:build/PlayerStatViewer.dll /reference:Refs\*.dll PlayerStatViewer.cs
      shell: cmd
