name: Build BONELAB Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download BONELAB & MelonLoader References
      run: |
        curl -L -o refs.zip "https://github.com"
        powershell Expand-Archive refs.zip -DestinationPath Refs

    - name: Compile Mod DLL
      run: |
        mkdir build
        csc /target:library /out:build/PlayerStatViewer.dll /reference:Refs\*.dll PlayerStatViewer.cs
      shell: cmd

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mod-DLL
        path: ./build/*.dll
